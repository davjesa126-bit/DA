services:
  - type: web
    name: brotia
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web.app:app
    envVars:
      - key: BROTIA_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BROTIA_MODEL
        value: claude-sonnet-5-5
